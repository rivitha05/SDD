name: Automation regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Local API contracts
        run: ./mvnw -B -ntp clean test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-results
          path: target/
          retention-days: 14
  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install browser and OS libraries
        run: ./mvnw -B -ntp test-compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI "-Dexec.args=install --with-deps ${{ matrix.browser }}"
      - name: Live jQuery UI scenarios
        run: ./mvnw -B -ntp -Pweb test -Dweb.browser=${{ matrix.browser }}
      - name: Generate Allure report
        if: always()
        run: ./mvnw -B -ntp allure:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-${{ matrix.browser }}-results
          path: target/
          retention-days: 14
