name: Android assessment demonstration
on:
  push:
    branches: [main]
    paths:
      - 'src/test/java/com/sdd/assessment/mobile/**'
      - 'src/test/java/com/sdd/assessment/core/**'
      - 'src/test/resources/features/mobile.feature'
      - 'src/test/resources/config/default.properties'
      - 'scripts/install-chromedriver.sh'
      - 'scripts/run-mobile-ci.sh'
      - 'pom.xml'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        description: Crash demonstration deliberately fails and leaves the job red
        default: mobile
        options: [mobile, crash-demo]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Appium tooling
        run: |
          npm install --global appium@2.19.0
          appium driver install uiautomator2@3.9.9
          ./scripts/install-chromedriver.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-boot-timeout: 300
          script: ./scripts/run-mobile-ci.sh "${{ inputs.suite || 'mobile' }}"
      - name: Generate Allure report
        if: always()
        run: ./mvnw -B -ntp allure:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ inputs.suite || 'mobile' }}-results
          path: |
            target/
            target-appium.log
            target-appium-console.log
          retention-days: 14
