name: Android assessment demonstration
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        description: Crash demonstration deliberately fails and leaves the job red
        default: mobile
        options: [mobile, crash-demo]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Appium tooling
        run: |
          npm install --global appium@2.19.0
          appium driver install uiautomator2@4.2.9
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          script: |
            sdkmanager "build-tools;35.0.0"
            adb shell wm size reset
            adb shell wm density 160
            appium --address 127.0.0.1 --log target-appium.log &
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:4723/status > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:4723/status > /dev/null
            ./mvnw -B -ntp -P${{ inputs.suite }} test
      - name: Generate Allure report
        if: always()
        run: ./mvnw -B -ntp allure:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ inputs.suite }}-results
          path: |
            target/
            target-appium.log
          retention-days: 14
